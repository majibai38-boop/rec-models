[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gpu-npu-profiling"
dynamic = ["version"]
description = "Offline GPU/NPU profiling alignment, accounting and evidence queries"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
gpu-npu-profiling = "profiling_tools.__main__:main"

[tool.setuptools]
packages = ["profiling_tools"]
package-dir = {profiling_tools = "."}
include-package-data = false

[tool.setuptools.dynamic]
version = {attr = "profiling_tools.version.__version__"}
