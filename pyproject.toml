[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "behavior-and-multi-task"
version = "0.1.0"
description = "PyTorch training framework for ETA, DIEN, AutoInt, and ESSM recommendation models"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
  { name = "Behavior and Multi-Task contributors" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy",
  "openpyxl",
  "pandas",
  "scikit-learn",
  "torch",
  "tqdm",
]

[project.optional-dependencies]
legacy = ["deepctr-torch"]

[project.scripts]
behavior-and-multi-task = "behavior_and_multi_task.main:main"

[project.urls]
Repository = "https://github.com/majibai38-boop/rec-models"

[tool.setuptools.packages.find]
include = ["behavior_and_multi_task*"]

[tool.setuptools.package-data]
"behavior_and_multi_task.data_process" = ["resources/*.json"]
